[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
evm_version = "prague"

[rpc_endpoints]
celo = "https://forno.celo.org"

[etherscan]
celo = { key = "${CELOSCAN_API_KEY}", url = "https://api.celoscan.io/api", chain = 42220 }

[invariant]
runs = 50000
depth = 100
fail_on_revert = false
